name: Render Arte 03 Canva em alta
on:
  push:
    branches: [saude-na-mao-assets]
    paths: [.github/workflows/render-art03-canva-hires.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saude-na-mao-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Renderizar Canva
        env:
          URL: 'https://www.canva.com/d/EQf1ciQNJrziK_G'
        run: |
          cat > /tmp/render.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1080,height:1350}, deviceScaleFactor:1});
          await page.goto(process.env.URL,{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(8000);
          // remove common chrome/UI overlays if present
          await page.addStyleTag({content:`header, [role='banner'], [data-testid*='toolbar'], [data-testid*='control'], button { visibility:hidden !important; } body { margin:0 !important; overflow:hidden !important; background:white !important; }`});
          await page.screenshot({path:'/tmp/full.png', fullPage:false});
          console.log('URL', page.url());
          console.log('TITLE', await page.title());
          await browser.close();
          JS
          node /tmp/render.mjs
          mkdir -p saude-na-mao-instagram/test
          cp /tmp/full.png saude-na-mao-instagram/test/arte-03-render.png
      - name: Commitar teste
        run: |
          git config user.name ALEXBRUNOB
          git config user.email ALEX.BRUNO@LIVE.COM
          git add saude-na-mao-instagram/test/arte-03-render.png
          git commit -m 'Renderiza teste alta Arte 03 pelo Canva' || exit 0
          git push origin HEAD:saude-na-mao-assets
