name: Materialize Saude na Mao Instagram Assets

on:
  push:
    branches:
      - saude-na-mao-assets
    paths:
      - .github/workflows/materialize-saude-na-mao-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saude-na-mao-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
