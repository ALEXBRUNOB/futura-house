          ]

          out = Path('saude-na-mao-instagram/feed')
          out.mkdir(parents=True, exist_ok=True)
          for index, item in enumerate(encoded, 1):
              url = unquote(item)
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urlopen(req, timeout=60) as response:
                  payload = response.read()
              image = Image.open(BytesIO(payload)).convert('RGB')
              if image.width < 320 or image.height < 400:
                  raise RuntimeError(f'Arte {index:02d} com dimensoes inesperadas: {image.size}')
              target = out / f'arte-{index:02d}.jpg'
              image.save(target, 'JPEG', quality=92, optimize=True, progressive=True)
              print(index, image.size, target.stat().st_size)
          PY
      - name: Commit public assets
        run: |
          git config user.name 'saude-na-mao-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add saude-na-mao-instagram/feed/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Hospeda artes 01 a 15 do Saude na Mao [assets-ready]'
          git push origin HEAD:saude-na-mao-assets
