name: Render Arte 03 Chrome rapido
on:
  push:
    branches: [saude-na-mao-assets]
    paths: [.github/workflows/render-art03-chrome-fast.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saude-na-mao-assets
      - name: Renderizar com Chrome instalado
        run: |
          set -e
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "BROWSER=$BROWSER"
          test -n "$BROWSER"
          "$BROWSER" --headless=new --no-sandbox --hide-scrollbars --disable-gpu --window-size=1080,1350 --virtual-time-budget=15000 --screenshot=/tmp/arte03.png 'https://www.canva.com/d/EQf1ciQNJrziK_G'
          file /tmp/arte03.png
          mkdir -p saude-na-mao-instagram/test
          cp /tmp/arte03.png saude-na-mao-instagram/test/arte-03-chrome.png
      - name: Commitar render
        run: |
          git config user.name ALEXBRUNOB
          git config user.email ALEX.BRUNO@LIVE.COM
          git add saude-na-mao-instagram/test/arte-03-chrome.png
          git commit -m 'Renderiza teste alta Arte 03 via Chrome' || exit 0
          git push origin HEAD:saude-na-mao-assets
