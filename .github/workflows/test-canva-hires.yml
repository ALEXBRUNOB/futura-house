name: Test Canva Hires
on:
  push:
    branches: [saude-na-mao-assets]
    paths: [.github/workflows/test-canva-hires.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test signed resize URL
        shell: bash
        run: |
          set -euo pipefail
          small='https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F321bf5c3-9746-445e-a35d-1127f80b7ae3/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAIPCjkmyEfWACu6gkAeJv9nW8nChijSaLvB8_GR6aGVg&exp=1786965698&osig=AAAAAAAAAAAAAAAAAAAAAKkm3usNfoh6q8OC7nwNHbazCsQH4ibdKr4eKPs-GvCy&signer=media-rpc&x-canva-quality=thumbnail'
          large=${small/height:200/height:1350}
          large=${large/width:160/width:1080}
          large=${large/quality:75/quality:90}
          large=${large/x-canva-quality=thumbnail/x-canva-quality=screen}
          echo 'Small:'
          curl -L --fail --silent --show-error "$small" -o /tmp/small.jpg
          file /tmp/small.jpg
          identify /tmp/small.jpg || true
          echo 'Large:'
          code=$(curl -L --silent --show-error -w '%{http_code}' "$large" -o /tmp/large.jpg || true)
          echo "HTTP=$code"
          file /tmp/large.jpg || true
          identify /tmp/large.jpg || true
