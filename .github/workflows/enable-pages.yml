name: Enable GitHub Pages fallback

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enable-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
