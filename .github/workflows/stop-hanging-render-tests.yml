name: Parar testes travados de render
on:
  push:
    branches: [saude-na-mao-assets]
    paths: [.github/workflows/stop-hanging-render-tests.yml]
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar testes travados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 32013877582 32013825052 32013743645; do
            curl -sS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/ALEXBRUNOB/futura-house/actions/runs/$id/cancel" || true
          done
