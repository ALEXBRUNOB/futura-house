name: Deploy FUTURA HOUSE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build public site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html fh360.html invideo.html _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          if [ -d assets ]; then cp -r assets _site/assets; fi
          if [ -d invideo ]; then cp -r invideo _site/invideo; fi
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
