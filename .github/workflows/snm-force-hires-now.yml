name: SNM - Forcar recuperacao hires agora

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == 'SNM-FORCE-HIRES-NOW'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar workflow de alta resolucao
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snm-extract-hires-from-canva.yml --repo ALEXBRUNOB/futura-house --ref main
