name: Normalize Instagram Assets 1080x1350

on:
  push:
    branches: [saude-na-mao-assets]
    paths: [.github/workflows/normalize-instagram-assets-1080.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saude-na-mao-assets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Normalizar sem alterar conteúdo
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          folder=Path('saude-na-mao-instagram/feed')
          for seq in range(4,16):
              p=folder/f'arte-{seq:02d}.jpg'
              im=Image.open(p).convert('RGB')
              print(seq, 'antes', im.size)
              if im.size != (1080,1350):
                  im=im.resize((1080,1350), Image.Resampling.LANCZOS)
                  im=im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=125, threshold=2))
                  im.save(p,'JPEG',quality=95,subsampling=0,optimize=True)
              check=Image.open(p)
              if check.size != (1080,1350):
                  raise SystemExit(f'Arte {seq} fora de 1080x1350')
              print(seq, 'depois', check.size, p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name 'ALEXBRUNOB'
          git config user.email 'ALEX.BRUNO@LIVE.COM'
          git add saude-na-mao-instagram/feed/arte-*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Normaliza artes 04-15 para 1080x1350'
          git push origin HEAD:saude-na-mao-assets
