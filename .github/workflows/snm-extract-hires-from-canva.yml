name: SNM - Recuperar Artes 01 e 03 em alta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snm-validate-hires-assets
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar branch isolada de assets
        uses: actions/checkout@v4
        with:
          ref: saude-na-mao-assets

      - name: Preparar validação
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --quiet pillow

      - name: Validar binários finais e gerar manifesto
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from json import dumps
          from pathlib import Path
          from PIL import Image

          expected = {
              '01': {
                  'sha256': '9fb5c4cc9b65f36f4f9a0f80fe52f8fed264d4f122141e694e488a30c06ffb67',
                  'bytes': 360719,
              },
              '03': {
                  'sha256': '000753a54c8a239d380349d6f075dfd459075808a48c9b758be172255b5f9d07',
                  'bytes': 379543,
              },
          }
          manifest = {'status': 'validated', 'target': '1080x1350', 'files': {}}
          for seq, wanted in expected.items():
              path = Path(f'saude-na-mao-instagram/feed/arte-{seq}.jpg')
              data = path.read_bytes()
              digest = sha256(data).hexdigest()
              with Image.open(path) as image:
                  image.load()
                  size = image.size
                  image_format = image.format
              if size != (1080, 1350):
                  raise SystemExit(f'ARTE {seq}: dimensão inválida {size}')
              if image_format != 'JPEG':
                  raise SystemExit(f'ARTE {seq}: formato inválido {image_format}')
              if len(data) != wanted['bytes']:
                  raise SystemExit(f'ARTE {seq}: tamanho inesperado {len(data)}')
              if digest != wanted['sha256']:
                  raise SystemExit(f'ARTE {seq}: SHA-256 divergente {digest}')
              manifest['files'][path.name] = {
                  'dimensions': '1080x1350',
                  'format': image_format,
                  'bytes': len(data),
                  'sha256': digest,
              }
              print(f'VALIDADA arte-{seq}.jpg 1080x1350 {len(data)} bytes {digest}')

          output = Path('saude-na-mao-instagram/hires-validation-manifest.json')
          output.write_text(dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Disponibilizar Artes 01 e 03 em alta
        uses: actions/upload-artifact@v4
        with:
          name: snm-artes-01-e-03-1080x1350
          path: |
            saude-na-mao-instagram/feed/arte-01.jpg
            saude-na-mao-instagram/feed/arte-03.jpg
            saude-na-mao-instagram/hires-validation-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
